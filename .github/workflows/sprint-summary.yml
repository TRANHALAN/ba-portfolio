name: Sprint Summary

on:
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest

    permissions:
      issues: read

    steps:
      - uses: actions/github-script@v7
        with:
          script: |

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              }
            );

            const bugs = issues.filter(i =>
              i.labels.some(l => l.name === 'bug')
            );

            const userStories = issues.filter(i =>
              i.labels.some(l => l.name === 'user-story')
            );

            const features = issues.filter(i =>
              i.title.startsWith('[FEATURE]')
            );

            const epics = issues.filter(i =>
              i.title.startsWith('[EPIC]')
            );

            console.log('===== SPRINT SUMMARY =====');
            console.log(`Open Issues: ${issues.length}`);
            console.log(`Bugs: ${bugs.length}`);
            console.log(`User Stories: ${userStories.length}`);
            console.log(`Features: ${features.length}`);
            console.log(`Epics: ${epics.length}`);
